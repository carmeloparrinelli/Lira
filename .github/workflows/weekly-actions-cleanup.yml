name: Weekly Actions storage cleanup

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only'
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

concurrency:
  group: weekly-actions-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old temporary artifacts and failed runs
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const cutoff = Date.now() - 7 * 86400000;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner, repo, per_page: 100});
            const successful = runs.filter(r => r.conclusion === 'success' && r.id !== context.runId)
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            const protectedIds = new Set(successful.slice(0,3).map(r => r.id));
            let artifactsDeleted = 0, runsDeleted = 0, bytes = 0, candidates = 0;
            for (const run of runs) {
              if (run.id === context.runId || new Date(run.created_at).getTime() >= cutoff) continue;
              if (['failure','cancelled'].includes(run.conclusion)) {
                core.info(`${dryRun ? 'WOULD DELETE' : 'DELETE'} failed/cancelled run ${run.id}`);
                if (!dryRun) { await github.rest.actions.deleteWorkflowRun({owner,repo,run_id:run.id}); runsDeleted++; }
              } else if (run.conclusion === 'success' && !protectedIds.has(run.id)) {
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner,repo,run_id:run.id,per_page:100});
                for (const artifact of artifacts) {
                  if (artifact.expired) continue;
                  candidates++; bytes += artifact.size_in_bytes || 0;
                  core.info(`${dryRun ? 'WOULD DELETE' : 'DELETE'} artifact ${artifact.name} id=${artifact.id}`);
                  if (!dryRun) { await github.rest.actions.deleteArtifact({owner,repo,artifact_id:artifact.id}); artifactsDeleted++; }
                }
              }
            }
            await core.summary.addHeading('Weekly cleanup').addRaw(
              `Preview: ${dryRun}; artifacts found: ${candidates}; deleted: ${artifactsDeleted}; candidate size: ${(bytes/1048576).toFixed(2)} MiB; failed/cancelled runs deleted: ${runsDeleted}`
            ).write();
