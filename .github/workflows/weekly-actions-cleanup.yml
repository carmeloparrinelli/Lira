name: Weekly Actions storage cleanup

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only'
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

concurrency:
  group: weekly-actions-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean obsolete build artifacts and old failed runs
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const cutoff = Date.now() - 7 * 86400000;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner,repo,per_page:100});
            const maintenance = new Set(['Weekly Actions storage cleanup','Audit Actions storage']);
            const successfulBuilds = runs.filter(r => r.conclusion === 'success' && !maintenance.has(r.name))
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            const protectedIds = new Set(successfulBuilds.slice(0,3).map(r => r.id));
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner,repo,per_page:100});
            let candidates = 0, deleted = 0, bytes = 0, failedRuns = 0;
            for (const artifact of artifacts) {
              if (artifact.expired || !artifact.workflow_run?.id || protectedIds.has(artifact.workflow_run.id)) continue;
              candidates++;
              bytes += artifact.size_in_bytes || 0;
              core.info(`${dryRun?'WOULD DELETE':'DELETE'} artifact ${artifact.name} (${artifact.id}) from run ${artifact.workflow_run.id}`);
              if (!dryRun) {
                await github.rest.actions.deleteArtifact({owner,repo,artifact_id:artifact.id});
                deleted++;
              }
            }
            for (const run of runs) {
              if (run.id === context.runId || maintenance.has(run.name) || new Date(run.created_at).getTime() >= cutoff) continue;
              if (['failure','cancelled'].includes(run.conclusion)) {
                core.info(`${dryRun?'WOULD DELETE':'DELETE'} failed/cancelled run ${run.id}`);
                if (!dryRun) {
                  await github.rest.actions.deleteWorkflowRun({owner,repo,run_id:run.id});
                  failedRuns++;
                }
              }
            }
            await core.summary.addHeading('Weekly cleanup').addTable([
              [{data:'Metric',header:true},{data:'Value',header:true}],
              ['Preview only',String(dryRun)],
              ['Artifacts found for deletion',String(candidates)],
              ['Artifacts deleted',String(deleted)],
              ['Candidate size (MiB)',(bytes/1048576).toFixed(2)],
              ['Old failed/cancelled runs deleted',String(failedRuns)],
              ['Protected recent successful builds',String(protectedIds.size)]
            ]).write();
